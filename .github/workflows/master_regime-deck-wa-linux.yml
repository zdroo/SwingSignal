# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - regime-deck-wa-linux

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Whole solution: Directory.Build.props enforces TreatWarningsAsErrors,
      # so building everything is the warning-free gate.
      - name: Build
        run: dotnet build RegimeDeck.slnx --configuration Release

      # ci.yml runs in parallel and so can't hold back a deploy — gate here too.
      - name: Test
        run: dotnet test RegimeDeck.Tests/RegimeDeck.Tests.csproj --configuration Release --no-build

      # Name the project. Publishing the solution sweeps in the test project and
      # fails NETSDK1194 (--output is unsupported when publishing a solution).
      - name: Publish
        run: dotnet publish RegimeDeck.Api/RegimeDeck.Api.csproj -c Release -o publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34E53D2CF9CB4337B5B1A9B59AFDD75D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_92623BEAD98243F6B6D6E9BC6B1081A2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_59BD03AFC23F44028DD1683C4018FF43 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'regime-deck-wa-linux'
          slot-name: 'Production'
          package: .
          